<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F8FA" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('seaandtea-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B1220' : '#F7F8FA');
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Discover Sri Lanka through sea, tea, and local experiences."
    />
    <link
      rel="preload"
      as="image"
      href="%PUBLIC_URL%/images/slider/sigiriya-960.webp"
      imagesrcset="%PUBLIC_URL%/images/slider/sigiriya-960.webp 960w, %PUBLIC_URL%/images/slider/sigiriya-1600.webp 1600w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Sea and Tea — Experiences in Sri Lanka</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
